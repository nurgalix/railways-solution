# ─────────────────────────────────────────────────────────────
# Health Index Configuration
# Edit this file to change thresholds and weights without
# restarting or recompiling the application.
# ─────────────────────────────────────────────────────────────
parameters:
  speed:
    weight: 0.25
    unit: "km/h"
    label: "Speed"
    normal_range: [0, 120]
    warning_range: [120, 140]
    critical_range: [140, 200]
  fuel_level:
    weight: 0.25
    unit: "%"
    label: "Fuel Level"
    # Inverted: lower is worse
    normal_range: [30, 100]
    warning_range: [15, 30]
    critical_range: [0, 15]
  pressure:
    weight: 0.25
    unit: "bar"
    label: "Pressure"
    # Inverted: lower is worse
    normal_range: [3.0, 6.0]
    warning_range: [2.0, 3.0]
    critical_range: [0.5, 2.0]
  temperature:
    weight: 0.25
    unit: "C"
    label: "Temperature"
    normal_range: [60, 95]
    warning_range: [95, 105]
    critical_range: [105, 130]
# Points deducted from raw index per active alert
alert_penalty:
  warning: 5
  critical: 15
# Health categories mapped from final index value
categories:
  A:
    min: 85
    max: 100
    label: "Normal"
  B:
    min: 70
    max: 85
    label: "Attention"
  C:
    min: 50
    max: 70
    label: "Warning"
  D:
    min: 25
    max: 50
    label: "Critical"
  E:
    min: 0
    max: 25
    label: "Emergency"
