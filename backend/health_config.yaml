# ─────────────────────────────────────────────────────────────
# Health Index Configuration
# Edit this file to change thresholds and weights without
# restarting or recompiling the application.
# ─────────────────────────────────────────────────────────────

parameters:
  speed:
    weight: 0.10
    unit: "km/h"
    label: "Speed"
    normal_range: [0, 120]
    warning_range: [120, 140]
    critical_range: [140, 200]

  fuel_level:
    weight: 0.08
    unit: "%"
    label: "Fuel Level"
    # Inverted: lower is worse
    normal_range: [30, 100]
    warning_range: [15, 30]
    critical_range: [0, 15]

  fuel_consumption:
    weight: 0.07
    unit: "L/h"
    label: "Fuel Consumption"
    normal_range: [0, 20]
    warning_range: [20, 30]
    critical_range: [30, 50]

  oil_pressure:
    weight: 0.12
    unit: "bar"
    label: "Oil Pressure"
    # Inverted: lower is worse
    normal_range: [3.0, 6.0]
    warning_range: [2.0, 3.0]
    critical_range: [0.5, 2.0]

  brake_pressure:
    weight: 0.12
    unit: "bar"
    label: "Brake Pressure"
    normal_range: [4.5, 7.0]
    warning_range: [3.5, 4.5]
    critical_range: [2.0, 3.5]

  coolant_temp:
    weight: 0.13
    unit: "°C"
    label: "Coolant Temperature"
    normal_range: [60, 95]
    warning_range: [95, 105]
    critical_range: [105, 130]

  exhaust_temp:
    weight: 0.10
    unit: "°C"
    label: "Exhaust Temperature"
    normal_range: [200, 450]
    warning_range: [450, 520]
    critical_range: [520, 650]

  bearing_temp:
    weight: 0.10
    unit: "°C"
    label: "Bearing Temperature"
    normal_range: [30, 70]
    warning_range: [70, 85]
    critical_range: [85, 110]

  voltage:
    weight: 0.09
    unit: "V"
    label: "Traction Voltage"
    normal_range: [2800, 3300]
    warning_range: [2500, 2800]
    critical_range: [2000, 2500]

  current:
    weight: 0.09
    unit: "A"
    label: "Traction Current"
    normal_range: [0, 1000]
    warning_range: [1000, 1200]
    critical_range: [1200, 1500]

# Points deducted from raw index per active alert
alert_penalty:
  warning: 5
  critical: 15

# Health categories mapped from final index value
categories:
  A:
    min: 85
    max: 100
    label: "Normal"
  B:
    min: 70
    max: 85
    label: "Attention"
  C:
    min: 50
    max: 70
    label: "Warning"
  D:
    min: 25
    max: 50
    label: "Critical"
  E:
    min: 0
    max: 25
    label: "Emergency"
